server:
  port: 8081

spring:
  application:
    name: yt-worker
  cloud:
    aws:
      sqs:
        enabled: ${YT_SQS_ENABLED:false}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=MonitorTranscription;encrypt=true;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:yt_app}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: youtube
        type:
          preferred_instant_jdbc_type: TIMESTAMP
    open-in-view: false

yt:
  sqs:
    enabled: ${YT_SQS_ENABLED:false}
    audio-arrivals-queue: ${YT_SQS_AUDIO_ARRIVALS_QUEUE:audio-arrivals}
  s3:
    bucket: ${YT_S3_BUCKET:monitorlatino}
    prefix: ${YT_S3_PREFIX:CHARTS}
  worker:
    poll-delay: ${YT_WORKER_POLL_DELAY:30000}
    temp-dir: ${YT_WORKER_TEMP_DIR:}
    yt-dlp-path: ${YT_DLP_PATH:yt-dlp}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    chunk-duration-seconds: 300
    max-attempts: 3

external:
  transcription:
    url: ${EXTERNAL_TRANSCRIPTION_URL:https://transcript.monitorlatino.com/api/v1}
    api-key: ${EXTERNAL_TRANSCRIPTION_API_KEY:default-transcription-key}
